{% extends 'base.html' %}
{% load static %}

{% block title %}Login - EduMaster{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle text-primary" style="font-size: 60px;"></i>
                            <h2 class="fw-bold mt-3">Welcome Back!</h2>
                            <p class="text-muted">Login to your account</p>
                        </div>
                        
                        {% if form.errors %}
                        <div class="alert alert-danger">
                            Username ya password galat hai
                        </div>
                        {% endif %}
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control form-control-lg" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control form-control-lg" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                                <i class="bi bi-box-arrow-in-right"></i> Login
                            </button>
                        </form>
                        
                        <div class="text-center">
                            <p class="mb-0">Account nahi hai? 
                                <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Register karo</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
