{% load static %}

<div id="ghusukSlider2026" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">

    <!-- Indicators -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#ghusukSlider2026" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#ghusukSlider2026" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#ghusukSlider2026" data-bs-slide-to="2"></button>
        <button type="button" data-bs-target="#ghusukSlider2026" data-bs-slide-to="3"></button>
        <button type="button" data-bs-target="#ghusukSlider2026" data-bs-slide-to="4"></button>
    </div>

    <!-- Slides -->
    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="{% static 'images/slider1.png' %}" class="d-block w-100" alt="Slider 1">
        </div>

        <div class="carousel-item">
            <img src="{% static 'images/slider2.png' %}" class="d-block w-100" alt="Slider 2">
        </div>

        <div class="carousel-item">
            <img src="{% static 'images/slider3.png' %}" class="d-block w-100" alt="Slider 3">
        </div>

        <div class="carousel-item">
            <img src="{% static 'images/slider4.png' %}" class="d-block w-100" alt="Slider 4">
        </div>

        <div class="carousel-item">
            <img src="{% static 'images/slider5.png' %}" class="d-block w-100" alt="Slider 5">
        </div>

    </div>

    <!-- Previous -->
    <button class="carousel-control-prev" type="button" data-bs-target="#ghusukSlider2026" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <!-- Next -->
    <button class="carousel-control-next" type="button" data-bs-target="#ghusukSlider2026" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>
